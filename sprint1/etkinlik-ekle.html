<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle | Kampüs Etkinlikleri</title>
</head>
<body>
  <header>
    <h1>Etkinlik Ekle</h1>
    <p>Yeni bir kampüs etkinliği oluşturmak için formu doldur.</p>
  </header>

  <nav aria-label="Ana menü">
    <a href="index.html">Ana Sayfa</a>
    <a href="etkinlikler.html">Etkinlikler</a>
    <a href="kariyer-gunleri-2026.html">Detay</a>
    <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
  </nav>

  <main>
    <form action="#" method="get">
      <p>
        <label for="etkinlik-adi">Etkinlik Adı</label><br>
        <input type="text" id="etkinlik-adi" name="ad" required>
      </p>

      <p>
        <label for="kategori">Kategori</label><br>
        <select id="kategori" name="kategori" required>
          <option value="" selected disabled>Kategori seçin</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="konferans">Konferans</option>
          <option value="sosyal">Sosyal etkinlik</option>
        </select>
      </p>

      <p>
        <label for="tarih-saat">Tarih / Saat</label><br>
        <input type="datetime-local" id="tarih-saat" name="tarih" required>
      </p>

      <p>
        <label for="yer">Yer</label><br>
        <input type="text" id="yer" name="yer" required>
      </p>

      <p>
        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" rows="4" cols="40" required></textarea>
      </p>

      <button type="submit">Gönder</button>
    </form>
  </main>

  <footer>
    <p>Ad Soyad · 20XXXXXX · 2026</p>
    <p><a href="etkinlikler.html">Etkinliklere dön</a></p>
  </footer>
</body>
</html>
